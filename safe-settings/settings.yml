# yaml-language-server: $schema=https://raw.githubusercontent.com/github-community-projects/safe-settings/3.0.0/schema/dereferenced/settings.json
---

ruleset_scope: repo

repository:
  allow_auto_merge: false
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_squash_merge: true
  delete_branch_on_merge: true
  has_projects: false
  has_wiki: false
