repository:
  allow_auto_merge: true

rulesets:
  - name: Require linear history
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: deletion
      - type: required_linear_history
      - type: required_signatures
